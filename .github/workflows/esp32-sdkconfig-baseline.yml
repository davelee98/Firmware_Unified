name: esp32 sdkconfig baseline

# The effective sdkconfig of every board is reviewed and checked in; drift must be approved.
#
# The port carried 77 behaviour-relevant sdkconfig differences from the Arduino build it is
# meant to reproduce, and only SIX were ones anybody declared. The other 71 were IDF defaults
# inherited by never naming the symbol -- invisible, because a setting you did not write does
# not appear in any file you can review. Among them: the S3 running at two-thirds clock, a
# debug-level optimisation build, the task watchdog no longer resetting a wedged device, and a
# tick rate that turned every sub-10 ms delay into no delay at all.
#
# docs/TOOLCHAINS.md's hand-maintained translation table existed for precisely this and caught
# two of those four. Same conclusion as the Arduino shim: give it a mechanical gate rather than
# good intentions. See targets/esp32-idf/tools/sdkconfig_baseline.sh.
#
# UNLIKE the shim ratchet, this needs a real toolchain -- the effective config only exists
# after a configure. That makes it the first CI job in this repo that builds anything, and it
# is a partial answer to the "three-toolchain CI matrix" gap in docs/NEXT_STEPS.md.
#
# ONE BOARD PER CHIP, not all ten. The differences this gates are overwhelmingly chip- and
# defaults-driven, and ten builds would put ~20 minutes on every PR touching the target. The
# other six boards are still gated locally, where tools/sdkconfig_baseline.sh with no arguments
# checks everything that has been built. That is a deliberate coverage gap, recorded here
# rather than left to be discovered: a board fragment change that alters only a non-represented
# board's config will NOT be caught by CI.

on:
  push:
    paths:
      - 'targets/esp32-idf/**'
      - '.github/workflows/esp32-sdkconfig-baseline.yml'
  pull_request:
    paths:
      - 'targets/esp32-idf/**'
      - '.github/workflows/esp32-sdkconfig-baseline.yml'

jobs:
  baseline:
    name: effective sdkconfig matches the recorded baseline
    runs-on: ubuntu-latest
    # Pinned to the same release targets/esp32-idf/.idf_version pins and build.sh enforces.
    # An IDF bump changes defaults underneath the project, which is exactly the drift this job
    # exists to surface -- so the image tag and the pin must move together, in one commit,
    # with the baselines re-recorded.
    container: espressif/idf:v5.5.4
    strategy:
      fail-fast: false
      matrix:
        board: [s3-n16r8, c3-n4, c6-n4, esp32-n4]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.board }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd targets/esp32-idf
          ./build.sh "${{ matrix.board }}"
      - name: Check baseline
        shell: bash
        run: targets/esp32-idf/tools/sdkconfig_baseline.sh "${{ matrix.board }}"
