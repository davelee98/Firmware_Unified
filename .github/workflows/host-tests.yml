name: host tests

# Compiles shared/ for the host and replays the wire-vector corpus against py-opendisplay.
#
# This is the boundary check that actually works. shared-boundary.yml is a grep: it sees
# #include lines and literal tokens, and cannot see an extern-declared vendor symbol, a
# macro leaked through a target config header, or a libc call absent on a freestanding
# target. A strict C99 compile does. The two workflows are complementary, and this one is
# the load-bearing half -- see docs/DESIGN_REVIEW_2026-07-25.md F4 and F8.
#
# It is green against an empty shared/ by design (docs/TEST_OWNERSHIP.md § "First step"),
# which is the point: every later import lands as a test-first change into a build that
# already enforces the contract, rather than having to stand the contract up first.

on:
  push:
  pull_request:
  schedule:
    # Nightly, 03:17 UTC. Deliberately off the hour -- see the nightly job below.
    - cron: '17 3 * * *'

jobs:
  # ---------------------------------------------------------------------------------
  # The compile gate. Both compilers, warnings are errors, no GNU extensions.
  # ---------------------------------------------------------------------------------
  host-build:
    name: shared/ compiles (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # a clang-only failure must stay visible when gcc passes
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          # gcc and clang are both preinstalled on ubuntu-latest; assert rather than
          # install, so a runner image change surfaces here instead of silently
          # dropping half the matrix.
          ${{ matrix.cc }} --version

      - name: Configure
        run: cmake -S tests/host -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------------
  # The same suite under ASan + UBSan.
  # ---------------------------------------------------------------------------------
  # The compile gate above proves shared/ builds warning-clean; it does not prove that a
  # buffer bound is right. This does, for every host test at once -- including the two
  # PRE-AUTH parsers, od_config_tlv and od_session, whose inputs an unauthenticated peer
  # controls.
  #
  # halt_on_error is not decoration: UBSan's default is to print a diagnostic and CARRY ON
  # with status 0, so without it this job goes green on a real finding.
  sanitizers:
    name: host tests under ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: |
          cmake -S tests/host -B build-asan -G Ninja \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-asan --output-on-failure

  # ---------------------------------------------------------------------------------
  # Fuzzing, bounded, on every PR.
  # ---------------------------------------------------------------------------------
  # MIGRATION.md Gate 1 requires fuzz coverage for anything reachable pre-authentication.
  # A minute per target is not a soak -- it is a GATE, so that a regression on the
  # handshake or the CCM envelope fails a PR rather than waiting for someone to run a
  # fuzzer by hand. Longer soaks stay manual.
  #
  # Clang only: -fsanitize=fuzzer is a Clang feature and gcc has no libFuzzer. The corpora
  # under tests/fuzz/corpus/ are committed, so each run starts from the coverage the last
  # one found instead of from nothing.
  #
  # A crash here means: commit the reproducer to the corpus AND pin it as a numbered case
  # in tests/host/session_test.c, so the regression fails the ordinary gcc+clang run too.
  fuzz-short:
    name: fuzz (60s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          clang --version

      - name: Configure
        run: cmake -S tests/host -B build-fuzz -G Ninja -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build build-fuzz

      # If tests/fuzz ever stops being registered -- a renamed guard, a moved directory --
      # every step below would silently pass with nothing to run. Fail loudly instead.
      - name: Assert the fuzz targets exist
        run: |
          for t in session_open_raw session_open_sealed session_auth; do
            test -x "build-fuzz/fuzz/od_fuzz_$t" || {
              echo "::error::od_fuzz_$t was not built — the pre-auth surface is unfuzzed"; exit 1; }
          done

      - name: Fuzz
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          for t in session_open_raw session_open_sealed session_auth; do
            echo "::group::$t"
            build-fuzz/fuzz/od_fuzz_$t -max_total_time=60 -runs=2000000 \
              -print_final_stats=1 tests/fuzz/corpus/$t
            echo "::endgroup::"
          done

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------
  # The corpus, against the version Home_Assistant_Integration actually pins.
  # ---------------------------------------------------------------------------------
  replay-pinned:
    name: corpus vs py-opendisplay 7.14.0 (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # py-opendisplay 7.14.0 declares requires-python >=3.13. Pinning 3.12 here
          # would fail at install, not at test, which is a confusing way to learn it.
          python-version: '3.13'

      - name: Install pinned py-opendisplay
        run: pip install 'py-opendisplay==7.14.0'

      - name: Replay vectors
        run: python tests/host/replay_vectors.py tests/vectors

  # ---------------------------------------------------------------------------------
  # The corpus, against whatever py-opendisplay released most recently.
  # ---------------------------------------------------------------------------------
  # This is the asymmetry TEST_OWNERSHIP § Ownership calls out and accepts: a
  # py-opendisplay change that breaks the wire contract will NOT fail on their PR,
  # because we pin. It fails here, up to 24 h late, and lands on us -- who then file it
  # upstream with a named vector, a byte string, and two decodes attached.
  #
  # It is scheduled-only and continue-on-error: an upstream release must not turn every
  # PR in this repo red, or the signal gets muted and the job stops meaning anything.
  replay-latest:
    name: corpus vs py-opendisplay latest (nightly, advisory)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # py-opendisplay 7.14.0 declares requires-python >=3.13. Pinning 3.12 here
          # would fail at install, not at test, which is a confusing way to learn it.
          python-version: '3.13'

      - name: Install latest py-opendisplay
        run: |
          pip install --upgrade py-opendisplay
          pip show py-opendisplay | grep -i '^version'

      - name: Replay vectors
        run: python tests/host/replay_vectors.py tests/vectors
