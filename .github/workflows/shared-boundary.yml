name: shared boundary

# The value of this repo rests on one invariant: shared/ compiles for EVERY target, so it
# may not include a vendor or framework header. That decays into a review habit unless it is
# enforced mechanically -- the moment one esp_*/nrf_*/zephyr include lands in shared/, that
# file stops being shareable and the repo quietly becomes four codebases in one directory.
on:
  push:
  pull_request:

jobs:
  no-vendor-includes-in-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject vendor/framework includes under shared/
        run: |
          # Header patterns that pin a file to one SDK. Extend as targets are imported.
          # Note the ESP-IDF families beyond esp_*: driver/, soc/, hal/, rom/ and freertos/
          # are all IDF-only, and TFT_eSPI's processor layer reaches for soc/ and hal/
          # directly. miniz.h is the ROM tinfl header (Firmware #124, via esp_rom) -- the
          # inflate ENGINE belongs in shared/compress, but the ROM binding does not.
          # Panel libraries (bb_epaper SPI, FastEPD parallel, TFT_eSPI/Seeed_GFX) are all
          # target-layer: shared/ reaches the panel only through od_hal_panel.
          PATTERN='#[[:space:]]*include[[:space:]]*[<"]([[:space:]]*)?(esp_|esp32|driver/|soc/|hal/|rom/|miniz|freertos/|nrf_|nrfx|nrf\.h|sl_|sli_|em_|zephyr/|Arduino\.h|WiFi\.h|ESPmDNS|bluefruit\.h|Adafruit|NimBLE|bb_epaper|FastEPD|TFT_eSPI|Seeed)'
          # third_party/ is deliberately NOT scanned. bb_epaper selects its IO backend by
          # #ifdef and every backend includes vendor headers, so it can never satisfy this
          # rule -- but it is still one vendored copy shared by all targets, not a per-target
          # fork. Do not "fix" that by moving it under shared/. See docs/TOOLCHAINS.md.
          #
          # shared/hal's own headers are od_hal_*.h and may legitimately be included as
          # "hal/od_hal_panel.h", which the IDF `hal/` family above would otherwise flag.
          # Exempt them -- but anchor the exemption on the INCLUDE TARGET, not on the line.
          # A bare `grep -v od_hal_` would let `#include <esp_wifi.h> /* od_hal_ */` through:
          # any line mentioning the string, in a comment or anywhere else, would be excused.
          EXEMPT='#[[:space:]]*include[[:space:]]*[<"][[:space:]]*hal/od_hal_'
          HITS=$(grep -rInE "$PATTERN" shared/ | grep -vE "$EXEMPT" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo
            echo "::error::vendor/framework include found under shared/."
            echo "shared/ must use only the C standard library and shared/hal interfaces."
            echo "Move the offending file to targets/<target>/, or route the dependency"
            echo "through a shared/hal interface. See docs/ARCHITECTURE.md."
            exit 1
          fi
          echo "OK: no vendor/framework includes under shared/"

      - name: Reject C++ and Arduino String under shared/
        run: |
          # shared/ must be plain C: two targets are C-only, and the Zephyr sources that are
          # the best donor for shared/core are already C. Arduino's String must never appear.
          if find shared/ -name '*.cpp' -o -name '*.cc' -o -name '*.hpp' | grep -q . ; then
            echo "::error::C++ source found under shared/. shared/ is plain C."
            find shared/ -name '*.cpp' -o -name '*.cc' -o -name '*.hpp'
            exit 1
          fi
          if grep -rInE '\bString\b' shared/ ; then
            echo "::error::Arduino String found under shared/. Use char[] or a length+ptr pair."
            exit 1
          fi
          echo "OK: shared/ is C-only with no Arduino String"

      - name: Protocol headers must not be hand-edited
        run: |
          # shared/protocol/ is a byte-for-byte copy of the canonical opendisplay-protocol
          # source. It deliberately contains no structs-with-behaviour, functions, or
          # typedefs beyond the config packets -- those are per-target concerns.
          if grep -rInE '^[[:space:]]*(void|int|bool|uint[0-9]+_t|static)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\(' shared/protocol/ ; then
            echo
            echo "::error::function declaration found in shared/protocol/."
            echo "These files are pure constants + config structs, synced from"
            echo "opendisplay-protocol. Never hand-edit them; change the canonical source"
            echo "and re-run tools/sync_protocol_header.py --push."
            exit 1
          fi
          echo "OK: protocol headers contain no function declarations"
