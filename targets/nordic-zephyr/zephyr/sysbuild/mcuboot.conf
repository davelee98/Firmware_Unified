# Battery-safe MCUboot: do not enable UART console.
# Default MCUboot brings up uart20 (P1.11 TX). After jump to the app
# (SERIAL=n), that TX can stay driven and back-feed the unpowered XIAO
# USB-UART bridge — flat mA-class static current on battery.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_LOG=n
