# Debug firmware profile: application DEBUG is enabled by CMake; retain Zephyr subsystem INFO
# records as a separate diagnostic channel. Production defaults subsystem logging to warnings.
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_NCS_BOOT_BANNER=y

# Thread awareness for OpenOCD/GDB. Exports the _kernel_thread_info_* offset tables that
# OpenOCD's Zephyr RTOS support reads to walk the thread list; without them a debugger only
# ever sees whichever thread the CPU was in when it halted, so "which thread is stuck" cannot
# be answered at all -- and a stale halt reads as a spinning thread. selects THREAD_MONITOR
# and THREAD_NAME. Debug profile only: it costs a name buffer and a monitor list entry per
# thread. The debugger side must also pass -rtos Zephyr (see debug-nrf54.sh).
CONFIG_DEBUG_THREAD_INFO=y

# Deferred-log capacity and drain rate. The generic 1 KiB buffer holds roughly ten od_log
# records -- each LOG_PRINTK copies the whole formatted line into the package -- while the
# processing thread is woken early only at ten pending messages and otherwise sleeps a full
# second. Capacity and wake threshold being the same number is what drops a burst: the panel
# pin dump alone is seven consecutive lines. Give the debug profile room and drain it eagerly;
# CONFIG_LOG_MODE_OVERFLOW discards the OLDEST records, so an undersized buffer loses exactly
# the lines that explain the ones that survive.
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
