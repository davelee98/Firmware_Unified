# Sysbuild config for boards that keep the ADAFRUIT bootloader (nRF52840), decided 2026-08-05 --
# NEXT_STEPS_2026-08-05.md Milestone 7. The nRF54 boards use sysbuild.conf and MCUboot.
#
# WHY A SEPARATE FILE RATHER THAN A CONDITIONAL. SB_CONFIG_* are sysbuild KCONFIG symbols, read
# from a conf file before any CMake in this directory runs. They cannot be set from
# sysbuild.cmake -- attempting it configures far enough to look plausible and then fails in
# NCS's partition_manager.cmake with "could not find TARGET mcuboot", because the Kconfig said
# MCUboot was wanted while the CMake said otherwise. Nor can -DSB_CONFIG_BOOTLOADER_MCUBOOT=n
# override sysbuild.conf on the command line; the file wins.
#
# Select it with -DSB_CONF_FILE=<this file>; build.sh does that automatically for xiao_ble.
SB_CONFIG_BOOTLOADER_MCUBOOT=n
