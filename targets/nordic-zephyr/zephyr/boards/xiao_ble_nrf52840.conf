# XIAO nRF52840 board config.
#
# TWO THINGS THIS BOARD NEEDS THAT THE nRF54 BOARDS DO NOT, both discovered by building:
#
# 1. DECLINE THE USB CDC ACM SERIAL BACKEND. The upstream board pulls it in via
#    boards/common/usb/Kconfig.cdc_acm_serial.defconfig, which defaults CONFIG_SERIAL and
#    CONFIG_UART_CONSOLE to y. This firmware logs over SEGGER RTT (prj.conf), so the two fight:
#    the build compiled cleanly and failed at LINK on an undefined `__device_dts_ord_100` --
#    the console UART device the CDC backend references but which nothing instantiates once
#    SERIAL is off.
#
#    BOARD_SERIAL_BACKEND_CDC_ACM is the switch (zephyr/boards/Kconfig:136), a plain bool that
#    defaults y. There is no BOARD_SERIAL_BACKEND_NONE, which was my first guess and did
#    nothing at all -- an unknown CONFIG_ in a .conf is silently ignored.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# 2. NO MCUboot ON THIS BOARD (Milestone 7: nRF52840 keeps the Adafruit bootloader). prj.conf
#    turns on MCUboot and the mcumgr BLE OTA DFU sample for the nRF54 boards; here both must be
#    off, and saying so explicitly matters because Kconfig treats "assigned y but got n" as a
#    warning and this build promotes warnings to errors.
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=n
CONFIG_MCUMGR_TRANSPORT_BT_DYNAMIC_SVC_REGISTRATION=n

# UF2 output is what the Adafruit bootloader consumes; the upstream board defconfig already
# enables it. Named here so the connection to the bootloader decision is visible.
CONFIG_BUILD_OUTPUT_UF2=y
