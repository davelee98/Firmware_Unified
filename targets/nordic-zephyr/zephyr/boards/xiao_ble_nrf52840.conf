# XIAO nRF52840 board config.
#
# CONSOLE: USB CDC ACM, NOT RTT.
#
# prj.conf logs over SEGGER RTT because the nRF54 boards are debugged with a J-Link. THE XIAO
# nRF52840 HAS NO ON-BOARD DEBUG PROBE, so RTT output goes nowhere -- the firmware runs and is
# simply silent. An earlier version of this file "fixed" a link error by disabling the board's
# CDC ACM backend, which left the board with no console at all. That was wrong: the right move
# is to switch the console to CDC, not to remove it.
#
# The original link error was a CONFLICT, not a reason to drop the console: prj.conf sets
# CONFIG_SERIAL=n while the board's Kconfig.defconfig defaults UART_CONSOLE to y for its CDC
# backend, so the build referenced a console UART device nothing instantiated (undefined
# __device_dts_ord_100). Turning SERIAL back on for this board resolves it properly.
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
# OpenDisplay's od_log compatibility layer submits native Zephyr log records. Keep exactly one
# USB-console writer by routing those records and subsystem logs through this backend; there is
# no parallel printf stream to splice bytes or independently translate newlines.
CONFIG_LOG_BACKEND_UART=y

# The board intentionally delays its log processing thread for 4 seconds so USB CDC can
# enumerate. Preserve the complete boot trace during that interval instead of overflowing the
# generic 1 KiB deferred-log buffer.
CONFIG_LOG_BUFFER_SIZE=4096

# RTT off: no probe on this board, and two backends both claiming stdout is how you get neither.
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n

# NO CONFIG_USB_DEVICE_STACK HERE. That is the LEGACY USB stack; this board uses the new one
# (subsys/usb/device_next), which its own Kconfig.defconfig brings in with the CDC ACM backend.
# Forcing the legacy stack on top builds both, and they define the same CDC ACM device:
#   multiple definition of `__device_dts_ord_123'
#     usbd_cdc_acm.c (device_next) vs cdc_acm.c (legacy)
# The board already wires USB up correctly; it needs nothing from this file.

# NO MCUboot here (Milestone 7: nRF52840 keeps the Adafruit bootloader). prj.conf enables
# MCUboot and the mcumgr BLE OTA DFU sample for the nRF54 boards; both must be off, and saying
# so explicitly matters because Kconfig treats "assigned y but got n" as a warning and this
# build promotes warnings to errors.
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=n
CONFIG_MCUMGR_TRANSPORT_BT_DYNAMIC_SVC_REGISTRATION=n

# UF2 output is what the Adafruit bootloader consumes.
CONFIG_BUILD_OUTPUT_UF2=y

# Production keeps Zephyr subsystems at WARN; PROFILE=debug restores subsystem INFO and enables
# OpenDisplay DEBUG in a separately named binary. Do not raise the global level here.
#
# I set CONFIG_LOG_DEFAULT_LEVEL=4 for bring-up and it made the console USELESS rather than
# more informative: DEFAULT_LEVEL is the default for EVERY module, so the kernel and the USB
# device stack started emitting a k_mutex_lock/unlock and udc_ep_enqueue line per operation.
# The board reported "infinite loop of errors"; they were not errors, they were os/udc debug
# spam, and it buried the app's own output under "--- 883 messages dropped ---".
#
# OpenDisplay retains its separate OD_LOG_LEVEL compile-time gate. Use the debug binary for app
# DEBUG; to go beyond subsystem INFO, raise only the relevant Zephyr module.
