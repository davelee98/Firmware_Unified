# Auto-picked for xiao_nrf54lm20a/nrf54lm20a/cpuapp (sysbuild-safe).
# gcc 8.2 cannot compile BT LL_ASSERT size-optimized asm (Zephyr 4.x debug.h)
# CONFIG_BT_CTLR_ASSERT_OPTIMIZE_FOR_SIZE is not set
CONFIG_NFC_T2T_NRFXLIB=y

# Channel Sounding + RAS reflector for this board.
#
# PER-BOARD, and it has to be. Appended to EXTRA_CONF_FILE it reaches the nRF52840, which has no
# Channel Sounding radio: every symbol below comes back "assigned y but got n", and this build
# promotes Kconfig warnings to errors. A ${BOARD} guard there is not a fix either -- BOARD is
# empty until find_package(Zephyr) unless west put it in the cache, so the guard silently takes
# the wrong arm.
#
# boards/<board>.conf is the mechanism that actually works, and it is the one this directory
# was already using.
# Channel Sounding + RAS reflector (compiled in; runtime-gated via DEVICE_FLAG_CHANNEL_SOUNDING)

CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_RAS=y
CONFIG_BT_RAS_RRSP=y
CONFIG_BT_RAS_MODE_3_SUPPORTED=n
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=2
CONFIG_BT_CS_DE_MAX_NUM_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=2
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=n
CONFIG_BT_CTLR_SDC_CS_ROLE_REFLECTOR_ONLY=y
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

# RTT up-buffer. The log backend writes in 16-byte chunks and the ring is NO_BLOCK_SKIP, so a
# ring that fills mid-record leaves a TRUNCATED line and says nothing -- unlike a deferred-buffer
# overflow, which at least prints "messages dropped". Sized here rather than in prj_debug.conf
# because CONFIG_SEGGER_RTT_BUFFER_SIZE_UP does not exist on xiao_ble (USE_SEGGER_RTT=n) and
# assigning an invisible symbol is fatal in this build.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
