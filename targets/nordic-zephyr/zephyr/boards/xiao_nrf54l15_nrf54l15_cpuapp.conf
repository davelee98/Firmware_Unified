# Auto-picked for xiao/nrf54l15_nrf54l15_cpuapp (sysbuild-safe).

# Channel Sounding + RAS reflector for this board.
#
# MOVED HERE FROM prj_cs.conf (2026-08-05). It used to be appended to EXTRA_CONF_FILE
# unconditionally, which broke the nRF52840: that part has no Channel Sounding radio, so every
# symbol below came back "assigned y but got n" and this build promotes Kconfig warnings to
# errors. Guarding the append on BOARD does not work -- BOARD is empty until
# find_package(Zephyr), which runs AFTER EXTRA_CONF_FILE is assembled (the pre-existing lm20
# guard has the same defect, which is why its content is mirrored into these board files too).
#
# boards/<board>.conf is the mechanism that actually works, and it is the one this directory
# was already using.
# Channel Sounding + RAS reflector (compiled in; runtime-gated via DEVICE_FLAG_CHANNEL_SOUNDING)

CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_RAS=y
CONFIG_BT_RAS_RRSP=y
CONFIG_BT_RAS_MODE_3_SUPPORTED=n
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=2
CONFIG_BT_CS_DE_MAX_NUM_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=2
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=n
CONFIG_BT_CTLR_SDC_CS_ROLE_REFLECTOR_ONLY=y
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

# NFC Type 2 Tag. The SoC has an NFCT peripheral and nrfxlib ships a library for this core, so the
# 0x0083 endpoint is a real tag here rather than the stub arm in opendisplay_nfc.c.
#
# NOT HARDWARE-TESTED, AND THERE IS NOTHING TO TEST IT WITH. No board in this fleet has an NFC
# antenna fitted, so every 0x0083 hardware row is open release debt -- see
# docs/HARDWARE_VERIFICATION_CHECKLIST.md. What this buys is that the shared machine is compiled
# and linked on the boards that could carry a tag, instead of silently reduced to a stub.
CONFIG_NFC_T2T_NRFXLIB=y

# RTT up-buffer. The log backend writes in 16-byte chunks and the ring is NO_BLOCK_SKIP, so a
# ring that fills mid-record leaves a TRUNCATED line and says nothing -- unlike a deferred-buffer
# overflow, which at least prints "messages dropped". Sized here rather than in prj_debug.conf
# because CONFIG_SEGGER_RTT_BUFFER_SIZE_UP does not exist on xiao_ble (USE_SEGGER_RTT=n) and
# assigning an invisible symbol is fatal in this build.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
